<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국어 학습 앱 리뉴얼 프로토타입 대시보드</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 좌측 사이드바: Anydevice 에뮬레이터 설정 및 화면 선택 -->
    <aside class="sidebar">
      <h2>Anydevice 에뮬레이터</h2>
      
      <div class="menu-section">
        <div class="menu-title">디바이스 종류</div>
        <div class="btn-group">
          <button class="btn active" id="btn-aos" onclick="setDevice('aos')">AOS (Android)</button>
          <button class="btn" id="btn-ios" onclick="setDevice('ios')">iOS</button>
        </div>
      </div>

      <div class="menu-section">
        <div class="menu-title">해상도 선택</div>
        <select class="combo-box" id="resolution-select" onchange="setResolution(this.value)">
          <!-- JS 동적 로딩 -->
        </select>
      </div>

      <div class="menu-section">
        <div class="menu-title">언어 설정</div>
        <div class="btn-group">
          <button class="btn active" id="btn-ko" onclick="setLanguage('ko')">한국어 (KO)</button>
          <button class="btn" id="btn-vi" onclick="setLanguage('vi')">Tiếng Việt (VI)</button>
        </div>
      </div>

      <div class="menu-section">
        <div class="menu-title">화면선택</div>
        <select class="combo-box" id="screen-select" onchange="setScreen(this.value)">
          <option value="main">1. 메인 학습 홈</option>
          <option value="mission">2. 학습 미션 [신규]</option>
          <option value="lang">3. 언어 설정</option>
          <option value="quiz">4. 단어 퀴즈</option>
        </select>
      </div>
    </aside>

    <!-- 중앙: 디바이스 레이아웃 화면 (에뮬레이터 값 반영) -->
    <main class="preview-area">
      <div id="device-wrapper" class="device-frame" style="width: 360px; height: 740px;">
        <div class="device-screen" id="device-content">
          <!-- JS 동적 로딩 -->
        </div>
      </div>
    </main>

    <!-- 우측: 정보 및 참고 자료 패널 -->
    <aside class="info-panel">
      <div class="info-card">
        <h3>화면 설명</h3>
        <div id="section-desc" class="section-content"></div>
      </div>
      
      <div class="info-card">
        <h3>개발 참고</h3>
        <div id="section-dev" class="section-content"></div>
      </div>
      
      <div class="info-card">
        <h3>디자인 참고</h3>
        <div id="section-design" class="section-content"></div>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
